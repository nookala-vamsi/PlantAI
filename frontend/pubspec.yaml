name: plant_disease_ai
description: "AI-powered plant disease identification app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # HTTP & Networking
  dio: ^5.4.0
  connectivity_plus: ^6.0.0

  # State Management
  flutter_riverpod: ^2.5.0

  # Navigation
  go_router: ^14.0.0

  # Secure Storage
  flutter_secure_storage: ^9.2.0

  # Camera & Image
  image_picker: ^1.1.0
  cached_network_image: ^3.3.0

  # UI & Animations
  google_fonts: ^6.2.0
  lottie: ^3.1.0
  shimmer: ^3.0.0
  fl_chart: ^0.69.0

  # Utilities
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/animations/
    - assets/crops/
    - .env
